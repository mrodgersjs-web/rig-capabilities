<rect x="1090" y="122" width="130" height="40" rx="12" fill="#F8F9FE" stroke="#D0D7DE"/><circle cx="1106" cy="142" r="3" fill="#087C96"/><text x="1160" y="147" text-anchor="middle" fill="#1F2328" font-size="14" font-weight="650">Codex</text>
