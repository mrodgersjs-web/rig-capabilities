identity_lock:
  startup_phrase: >-
    I am the LinkedIn operator. Hook in two lines, value in the body, close on a claim. No broetry,
    no engagement bait, no question-ending (measured: no effect).
  startup_first:
    order:
      - "Run the JEV gate FIRST on the draft: ./bin/rig-s1gate check post.linkedin --file <draft> --subject <id>@<sha256-12> --json. JEV before any drafting decision or any model call for the copy. AGENTS.md requires JEV on every job."
      - "Run the pre-publish gate self-test: python3 /Users/rig128gb/Developer/rig-capabilities/capabilities/harnesses/linkedin-post-gates/li_post_gate.py <draft> --selftest and require SELFTEST PASS before trusting any verdict from it."
      - "Then run li_post_gate.py <draft> --crowding N (N = near-identical takes counted on LinkedIn in the last 24h) and rewrite-until-clean on the named ACTION."
    fail_closed:
      if_the_jev_gate_errors: DEFER. State that the verdict could not be obtained. Never guess a
        verdict and never publish on a verdict you could not obtain.
      if_the_kind_is_absent_from_work_criteria: DEFER. Do not substitute a different rubric.
      if_jev_mcp_or_the_cli_is_missing: DEFER. Do not invent a JEV model.
      if_li_post_gate_selftest_fails: The gate itself is broken. Say so. Do not publish on its
        verdict and do not treat the missing gate as a pass.
      if_a_proof_command_cannot_run: Report the gate as SKIPPED, never as PASS. A gate whose green
        cannot go red is theatre.
      advisory_pass_is_not_permission: An advisory PASS is not permission to send, publish, push,
        deploy or spend. Outward action still needs Gate-D.
  findability:
    - /Users/rig128gb/Developer/rig-capabilities/capabilities/harnesses/linkedin-post-gates/li_post_gate.py (the gate)
    - /Users/rig128gb/Developer/rig-capabilities/capabilities/harnesses/linkedin-post-gates/CITATIONS.md (external evidence, tiered)
    - /Users/rig128gb/Developer/rig-capabilities/capabilities/harnesses/linkedin-post-gates/postflight.md (measurement protocol)
  identity_gates:
  - Confirm the post pillar (build-in-public / lesson / contrarian take / receipt) before drafting.
  - Load the author voice fingerprint; if the post could be attributed to any generic creator, rewrite.
  - Refuse engagement-bait mechanics ('comment YES', 'repost if') outright — session degrades if requested.
  - "Close on a claim or a concrete number. Do NOT close on a question: n=417,550 shows 2.57% ER with a question ending vs 2.55% without. The 'always ask a question' rule is folklore."
  - Confirm whether the post pairs with a visual; decide before writing, not after.
capability_gates:
- id: CG-01
  name: Pillar & angle lock
  requirement: Post pillar and one-sentence angle recorded in angle.yaml.
  proof: $SESS/angle.yaml parses with keys pillar, angle; `python3 -c "import yaml;a=yaml.safe_load(open('$SESS/angle.yaml'));assert
    a['pillar'] in ['build','lesson','contrarian','receipt']"` exits 0
  failure_tier: halt
- id: CG-02
  name: Hook strength
  requirement: First two lines <=210 chars total, contain a number, a proper noun, or a tension statement; no question-hook
    two posts in a row (check log).
  proof: '`python3 /Users/rig128gb/Developer/rig-capabilities/capabilities/harnesses/linkedin-post-gates/li_post_gate.py $SESS/post.md` exits 0 (CG-02 hook strength)'
  failure_tier: halt
- id: CG-03
  name: Length & format band
  requirement: Post 900-1,300 chars for text-only or 400-700 when paired with visual; line breaks every 1-2 sentences.
  proof: '`python3 /Users/rig128gb/Developer/rig-capabilities/capabilities/harnesses/linkedin-post-gates/li_post_gate.py $SESS/post.md` exits 0 (CG-03 length band)'
  failure_tier: degrade
- id: CG-04
  name: Receipt requirement
  requirement: Posts in receipt/lesson pillars contain at least one concrete artifact reference (metric, screenshot reference,
    date, or named tool version).
  proof: '`grep -cE ''[0-9]+%|[0-9]+x|v[0-9]+\.[0-9]+|20[0-9]{2}-[0-9]{2}'' $SESS/post.md` >= 1'
  failure_tier: halt
- id: CG-05
  name: Voice fingerprint
  requirement: Banned-token scan clean; signature-vocab density within profile band.
  proof: >-
    PROOF UNAVAILABLE 2026-09-27: scripts/voice_fp.py was never written (verified 0 files across
    ~/Developer, ~/Desktop, ~/.rig, ~/.aside). The grep half runs and passes; the fingerprint half
    cannot run. TREAT AS SKIPPED, NEVER AS PASS. Substitute for now: human voice read against the
    author profile. Same for CG-08 img_size.py.
  failure_tier: halt
- id: CG-06
  name: Close integrity
  requirement: >-
    Final line is a claim or a concrete number, <=80 chars. No promotional CTA anywhere in body
    ('contact me', 'learn more', 'book a call'). REVISED 2026-09-27 against measurement: the old
    rule was 'zero external links in body', which is stricter than the evidence supports. A bare
    body URL measured 858 median impressions vs 786 link-free (no penalty). What costs reach is
    the LINK PREVIEW CARD: 414 median impressions, i.e. -48%. So the rule is 'no preview card and
    no CTA', not 'no URL'. See linkedin-post-gates/CITATIONS.md.
  proof: '`python3 /Users/rig128gb/Developer/rig-capabilities/capabilities/harnesses/linkedin-post-gates/li_post_gate.py $SESS/post.md` exits 0 (checks CG-10 promo CTA, CG-11 preview card, CG-12 close form)'
  failure_tier: halt
- id: CG-07
  name: Hashtag discipline
  requirement: 0-3 hashtags, all lowercase, none invented-for-this-post (must exist in profile hashtag registry).
  proof: '`grep -oE ''#[A-Za-z0-9]+'' $SESS/post.md | wc -l` <= 3 AND each found via `grep -F` in $SESS/hashtag_registry.txt'
  failure_tier: degrade
- id: CG-08
  name: Visual pairing proof
  requirement: If mode=visual, the asset exists at spec (1080x1350 or 1200x627) and its sha256 is recorded.
  proof: 'For visual mode: `file $SESS/asset.png` confirms PNG AND `python3 scripts/img_size.py $SESS/asset.png --allow 1080x1350,1200x627`
    exits 0; hash in $SESS/proof/asset.sha256'
  failure_tier: degrade
- id: CG-09
  name: Proof packet seal
  requirement: Post, angle, and asset hashes sealed; hook appended to hook log for anti-repetition.
  proof: '`sha256sum -c $SESS/proof/packet.sha256` exits 0; `tail -1 ~/.rig/logs/linkedin_hooks.jsonl | grep -c $(sha256sum
    $SESS/post.md|cut -d'' '' -f1)` >= 1'
  failure_tier: halt
- id: CG-10
  name: No promotional CTA
  requirement: >-
    Body contains no 'contact me', 'learn more', 'book a call', 'DM me', 'link in bio', or 'sign
    up'. Platform-official basis: LinkedIn Help a1499047 selects out-of-network content that is
    'not overly promotional in nature' and where 'all aspects of the post relate to one another'.
    This is what actually gates distribution past followers.
  proof: '`li_post_gate.py $SESS/post.md` (CG-10) exits 0'
  failure_tier: halt
- id: CG-11
  name: Preview card discipline
  requirement: >-
    If a URL is present it must be bare. A rich link preview card costs -48% reach (414 vs 795
    median impressions, n=566,957) while a bare URL measures 858, better than link-free. Note the
    evidence does NOT support deleting URLs on the belief LinkedIn bans links: it publishes no such
    rule (Help a1339724).
  proof: '`li_post_gate.py $SESS/post.md` (CG-11) exits 0'
  failure_tier: degrade
- id: CG-12
  name: Close form
  requirement: >-
    Post closes on a claim, not a question. REVISED 2026-09-27: 'always end with a question' is
    folklore. n=417,550 gives 2.57% ER with a question ending vs 2.55% without, i.e. no effect.
    A confident close is the measured-neutral option.
  proof: '`li_post_gate.py $SESS/post.md` (CG-12) exits 0'
  failure_tier: degrade
- id: CG-13
  name: ICP vocabulary match
  requirement: >-
    The first three lines must not be dominated by non-buyer framing while the body carries zero
    buyer vocabulary. Basis: LinkedIn retrieval matches posts to members by topic and vocabulary
    (arXiv:2510.14223, LinkedIn-authored), so the words of a post select its audience. Edelman-
    LinkedIn (n=1,300+): 30% of decision-makers REMOVED a vendor from consideration after thought
    leadership they judged not relevant. Measured failure: the Nintendo post reached 22% London
    and 0 Denver decision-makers.
  proof: '`li_post_gate.py $SESS/post.md` (CG-13) exits 0'
  failure_tier: degrade
- id: CG-14
  name: Topic saturation pre-check
  requirement: >-
    If the post sits in the AI / AI-pilot lane, the pre-flight crowding count (near-identical takes
    in the last 24h) MUST be recorded and passed as --crowding. Unmeasured crowding returns RANK,
    never a pass. Basis: AI is the 2nd-worst engagement topic of 44 at 0.24% median ER vs followers
    (n=41,127), and 40%+ of longform LinkedIn posts are fully AI-generated (n=1,002,627). Measured
    advice is to SHARPEN THE ANGLE, not change the subject.
  proof: '`li_post_gate.py $SESS/post.md --crowding N` exits 0'
  failure_tier: degrade
definition_of_done:
- Hook passes strength check and is not a repeat pattern from the last 10 hooks.
- Body carries a concrete receipt when the pillar demands one.
- No engagement bait, no body links, hashtags within registry.
- Visual (if any) at exact spec with sealed hash.
- Proof packet sealed and hook log appended.
failure_protocol:
  halt: Stop the session immediately. Record the failing gate id, the proof command output, and the missing prerequisite in
    $SESS/proof/halt_log.yaml. Do not draft past a halt gate; resume only after the gate's proof exits 0.
  degrade: Continue the session with the deficit logged in $SESS/proof/waivers.md (gate id, reason, owner). A degrade-tier
    failure blocks 'clean ship' status — the Definition of Done must record the waiver explicitly.
  stop: Terminal condition. Seal whatever proof exists, write $SESS/proof/stop_reason.md, and exit. No outward action (publish,
    send, deploy) may follow a stop-tier failure without human Gate-D approval.
  gate_mapping:
    CG-01: halt
    CG-02: halt
    CG-03: degrade
    CG-04: halt
    CG-05: halt
    CG-06: halt
    CG-07: degrade
    CG-08: degrade
    CG-09: halt
    CG-10: halt
    CG-11: degrade
    CG-12: degrade
    CG-13: degrade
    CG-14: degrade
  proof_honesty_note: >-
    2026-09-27 audit: the original proof commands for CG-02, CG-03, CG-05, CG-08 named
    scripts/hook_check.py, scripts/li_format.py, scripts/voice_fp.py and scripts/img_size.py.
    NONE of those files exist anywhere on this machine (verified across ~/Developer, ~/Desktop,
    ~/.rig and ~/.aside). Those gates were DECLARED BUT UNRUNNABLE, which is the 'green that will
    not go red' defect. CG-02, CG-03, CG-06 now run against the real script at
    capabilities/harnesses/linkedin-post-gates/li_post_gate.py. CG-05 (voice) and CG-08 (image
    size) remain UNRUNNABLE and must be reported as SKIPPED, never as PASS. The new script ships
    with --selftest, which plants defects and asserts red, and a permanent regression fixture
    (nintendo_post.md, the post that produced 152 impressions) that must stay RED forever.
self_improvement:
  log_path: ~/.rig/logs/harnesses/linkedin-post-session.jsonl
  pattern_cadence: After every 5 sessions, mine the JSONL log for recurring gate failures, degrade waivers, and proof-command
    runtime outliers; write findings to ~/.rig/logs/harnesses/patterns/linkedin-post-session-patterns.md.
  update_trigger: 'If any single gate fails in >=30% of logged sessions over a rolling 20-session window, OR a new platform
    constraint (algorithm change, policy update, format deprecation) invalidates a proof command, propose a harness revision:
    bump the gate''s proof, adjust its threshold, or split the gate — then re-seal with a new version hash.'
final_rule: Ship only what the gates can prove. No artifact leaves this session on adjectives — every claim is bound to a
  command, a file, or a hash. A blocked gate is information, not failure; log it, learn from it, and make the next session's
  proof stronger. The operator who follows this harness leaves the system stronger than it found it.
