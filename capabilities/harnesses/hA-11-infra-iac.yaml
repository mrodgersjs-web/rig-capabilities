---
outcome: infra-ops:
done_when:
  - file:capabilities/harnesses/hA-11-infra-iac.yaml
  - a session of this type completes with its gate green
great_example: examples/great/infra-ops/hA-11-infra-iac.yaml.md
quality_floor: 0.6
---

harness_id: hA-11-infra-iac
harness_name: Infrastructure-as-Code Session Goal Harness
session_type: infra-iac-session
coordinate_space:
  levels: [L3, L4, L5]
  diamonds: [D1, D2, D3]
  bms_modes: [A1, A2]
  iqrsqpi_steps: [I, Q, R, S, Q2, P, I2]
harness_tuple: H_iac(state_lock, plan_review, policy_gate, drift_check, improvement)
primary_diamonds: [D1, D3]
bms_bias: "A2 for module authoring; A1 for plan/policy verification; A3 for docs; A4 (apply) only with explicit Gate-D approval"
identity_lock:
  startup_phrase: "Plan is the contract. Apply is a ceremony, never a surprise."
  gates:
    - id: "0.1"
      requirement: "Startup phrase spoken and the IaC target pinned: tool (terraform/opentofu/pulumi/cdk), workspace/stack, and backend state location"
      proof: "Session log contains tool+version (terraform version output), workspace, and backend config path"
    - id: "0.2"
      requirement: "Procedures declared mandatory: fmt+validate before plan, plan reviewed by a second pair of eyes (human or reviewer agent), policy-as-code green, no apply without Gate-D"
      proof: "All four procedure names in session preamble"
    - id: "0.3"
      requirement: "RIG coordinate stated before the first HCL edit"
      proof: "Session log line 'COORD: L3-L5 x D1-D3 x A1/A2 x IQRSQPI'"
    - id: "0.4"
      requirement: "Harness tuple H_iac(state_lock, plan_review, policy_gate, drift_check, improvement) declared"
      proof: "Tuple declaration present in session log"
capability_gates:
  - category: "Authoring Discipline"
    gates:
      - id: "1.1"
        requirement: "Format and validate clean: terraform fmt -check -recursive and terraform validate (or pulumi preview typecheck) exit 0 on the changed modules"
        proof: "Exit codes + output in .rig/iac/fmt-validate.txt"
        failure_tier: halt
      - id: "1.2"
        requirement: "Static security scan: checkov / tfsec / trivy config run over changed modules; every finding fixed or suppressed with a written reason and expiry"
        proof: "Scan report in .rig/iac/security-scan.txt; suppressions table in .rig/iac/suppressions.md (finding | reason | expiry)"
        failure_tier: halt
      - id: "1.3"
        requirement: "No secrets in code or state-pointers: no hardcoded credentials, keys, or tokens (gitleaks over module dir); sensitive values come from vars marked sensitive, Vault/SSM data sources, or env"
        proof: "gitleaks report empty; grep -rnE '(aws_secret|private_key|password\\s*=)' over .tf files returns only var references"
        failure_tier: stop
      - id: "1.4"
        requirement: "Version pins: provider and module versions pinned (required_providers with ~> or =), no floating 'latest' module refs"
        proof: "grep over changed .tf files shows version constraints on every provider/module block"
        failure_tier: degrade
  - category: "Plan & Policy"
    gates:
      - id: "2.1"
        requirement: "Plan captured as artifact: terraform plan -out=tfplan plus terraform show -json tfplan saved; plan reviewed line-by-line for destroys and replacements"
        proof: ".rig/iac/tfplan + tfplan.json exist; .rig/iac/plan-review.md lists every destroy/replace action with a verdict"
        failure_tier: halt
      - id: "2.2"
        requirement: "Destroy protection: any resource being destroyed or replaced has an explicit human-acknowledged note; production stateful resources carry prevent_destroy or the exception is documented"
        proof: "plan-review.md destroy section signed (name + date); lifecycle blocks grep-verified on stateful resources"
        failure_tier: halt
      - id: "2.3"
        requirement: "Policy-as-code green: OPA/conftest or terraform-compliance policies run against tfplan.json and pass (or violations carry approved waivers)"
        proof: "conftest test tfplan.json output in .rig/iac/policy.txt; waiver list with approver names"
        failure_tier: halt
      - id: "2.4"
        requirement: "Cost delta estimated: infracost breakdown (or equivalent) run on the plan; monthly delta recorded and flagged if it exceeds the session's stated threshold"
        proof: ".rig/iac/cost.txt with infracost output and the delta line highlighted"
        failure_tier: degrade
  - category: "State & Drift"
    gates:
      - id: "3.1"
        requirement: "State integrity: remote state backend confirmed (no local state for shared infra), state locking enabled, and terraform plan -refresh-only (or drift detection) shows no unmanaged drift before the change"
        proof: "Backend config block path + refresh-only plan output in .rig/iac/drift-before.txt; drift items each dispositioned"
        failure_tier: halt
      - id: "3.2"
        requirement: "Blast radius mapped: the plan's affected resources mapped to the services/environments they serve; shared resources (VPC, DNS, IAM) get an extra caution flag"
        proof: ".rig/iac/blast-radius.md with resource→service mapping; shared-resource flags present"
        failure_tier: halt
  - category: "Closure"
    gates:
      - id: "4.1"
        requirement: "Rollback path written: how to un-apply this change (revert commit + plan, or state rm + import instructions for renames) documented before apply is requested"
        proof: ".rig/iac/rollback.md with concrete commands; rename cases covered with state mv commands"
        failure_tier: halt
      - id: "4.2"
        requirement: "Apply request packaged (not executed): a Gate-D request containing plan artifact path, destroy summary, cost delta, blast radius, and rollback pointer"
        proof: ".rig/iac/APPLY-REQUEST.md exists with all five fields; session log states 'apply deferred to Gate-D'"
        failure_tier: halt
      - id: "4.3"
        requirement: "Improvement entry written: one module smell, one policy gap, or one drift source discovered"
        proof: "Appended line to ~/.hermes/jake/improvements.log tagged hA-11-infra-iac"
        failure_tier: halt
definition_of_done:
  - "All gates passed or degraded-with-log; zero unresolved halt gates, zero stop events"
  - "Plan artifact + reviewed destroy/replace list on disk"
  - "Policy check green or waived with approvers"
  - "APPLY-REQUEST.md packaged for Gate-D; no apply executed in-session"
  - "One improvement entry appended"
  - "Identity closure: coordinate, plan verdict, next safe action stated"
failure_protocol:
  halt_gates: ["1.1", "1.2", "2.1", "2.2", "2.3", "3.1", "3.2", "4.1", "4.2", "4.3"]
  degrade_gates: ["1.4", "2.4"]
  stop_gates: ["1.3"]
  notes: "terraform apply / pulumi up is ALWAYS out of session scope without an approved APPLY-REQUEST through Gate-D"
self_improvement:
  log_path: "~/.hermes/jake/improvements.log"
  pattern_cadence: 5
  update_trigger: "same policy violation or drift source recurs 3+ times → add an OPA rule or module default that prevents the class"
final_rule:
  - "No plan artifact, no discussion of apply."
  - "Every destroy is signed before it is possible."
  - "Secrets in state-code stop the world."
  - "No improvement entry, no session complete."
  - "Every infra-iac session leaves the system stronger than it found it."
governs_loops: [GL-SI, GL-BD, GL-VQ]
