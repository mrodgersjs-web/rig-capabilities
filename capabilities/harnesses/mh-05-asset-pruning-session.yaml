---
outcome: agent-engineering:
done_when:
  - cmd:python3 -m unittest tests.test_lifecycle; test $? -eq 0
  - cmd:python3 -m rig_capabilities.lifecycle plan --example --now 2026-09-02; test $? -eq 0
  - cmd:python3 -m rig_capabilities.lifecycle plan --example --now 2026-09-02 --plant revocation; rc=$?; test $rc -eq 2
  - cmd:python3 -m rig_capabilities.lifecycle plan --example --now 2026-09-02 --plant one_way_door; rc=$?; test $rc -eq 2
  - cmd:python3 -m rig_capabilities.lifecycle plan --example --now 2026-09-02 --plant utility_evict; rc=$?; test $rc -eq 2
  - cmd:python3 -m rig_capabilities.lifecycle plan --example --now 2026-09-02 --plant state_record; rc=$?; test $rc -eq 2
  - file:rig_capabilities/lifecycle.py
  - file:tests/test_lifecycle.py
  - file:capabilities/harnesses/mh-05-asset-pruning-session.yaml
  - cmd:./bin/rig-capabilities goal-spec --stem mh-05-asset-pruning-session
great_example: examples/great/agent-engineering/mh-05-asset-pruning-session.yaml.md
quality_floor: 0.6
---

harness_id: mh-05-asset-pruning-session
harness_name: Asset Pruning Session Goal Harness
session_type: asset-pruning-session
coordinate_space:
  levels: [L3, L4]
  diamonds: [D1, D3]
  bms_modes: [A1]
  iqrsqpi_steps: [I, Q, R, S, Q2, P, I2]
harness_tuple: H_prune(condemnation_set, failing_tests, drift_findings, restore_points, utility_findings, attribution_findings, lifecycle_plan, verdict)
primary_diamonds: [D1, D3]
bms_bias: "A1 exclusively — pruning is evidence-only; A2 forbidden (no prose may argue for a cut); A3 forbidden; A4 forbidden — deletion executes only after human Gate-D approval of the condemnation set. Revocation (un-routing an asset on negative attribution or an open risk flag) is a safety action taken on recorded evidence, not a deletion, and never waits on Gate-D; removing a revoked asset's files does"
identity_lock:
  startup_phrase: "I am the surgeon. Nothing dies without a failing test on record — and I restore before I cut."
  gates:
    - id: "0.1"
      requirement: "Startup phrase spoken and pruning scope pinned: the exact asset classes in scope (skills, harnesses, agents, catalogs) and the absolute exclusion list declared before any evaluation begins"
      proof: "Session log line 'SCOPE: <classes> | EXCLUDE: <paths>'; exclusion list saved to .rig/prune/exclusions.txt"
    - id: "0.2"
      requirement: "Pruning doctrine loaded: condemnation requires a recorded failing done-test or a quantified drift/usage verdict — boredom, taste, and age alone never condemn. Two additions stated in the same breath: retention is COMPUTED and not reviewed (U(s) below theta or decayed activation frequency condemns an asset that passes every test), and REVOCATION is not EVICTION (negative reuse attribution retires an asset regardless of usefulness; low utility only removes a restorable one)"
      proof: "Session preamble contains the phrases 'failing done-test recorded', 'no cut without evidence', 'retention is computed', and 'revocation is not eviction'"
    - id: "0.3"
      requirement: "RIG coordinate stated before any asset is evaluated"
      proof: "Session log line of form 'COORD: L3-L4 x D1-D3 x A1 x IQRSQPI'"
    - id: "0.4"
      requirement: "Harness tuple H_prune(condemnation_set, failing_tests, drift_findings, restore_points, utility_findings, attribution_findings, lifecycle_plan, verdict) declared with all eight components named, and the session states which two feeds drive condemnation: failing evidence and measured (non-)value plus reuse attribution"
      proof: "Session log contains the tuple declaration verbatim"
capability_gates:
  - category: "Condemnation Evidence"
    gates:
      - id: "1.1"
        requirement: "Every condemned skill carries a recorded failing done-test: the skill's own '## Done test' block was executed and exited non-zero against the CURRENT artifact, with output on file — no skill enters the condemnation set on inspection alone"
        proof: "Per condemned skill: bash -c <extracted done-test> exit code != 0 with stdout/stderr saved to .rig/prune/failures/<skill>.txt; python3 assertion that condemnation set == set of recorded failure files"
        failure_tier: halt
      - id: "1.2"
        requirement: "Restorability proven before any cut: every condemnation-set asset is archived (tar of the asset directory plus its catalog row) and the archive's integrity verified"
        proof: "tar -czf .rig/prune/restore/<asset>.tar.gz <asset dir> followed by tar -tzf listing matching the source file list; sha256 of archive recorded in .rig/prune/restore/manifest.txt"
        failure_tier: halt
      - id: "1.3"
        requirement: "Reverse-dependency sweep: no surviving asset references a condemned one — catalogs, agent manifests, and harness bindings are grepped for each condemned name"
        proof: "grep -rn '<condemned-name>' artifacts/ excluding the asset itself and .rig/prune/ returns zero hits, or each hit has a written migration line in .rig/prune/dependents.txt"
        failure_tier: halt
      - id: "1.4"
        requirement: "Lifecycle state declared before anything is evaluated: every asset in scope carries lifecycle_state in {active, dormant, deprecated, evicted, revoked} WITH a recorded reason and timestamp, so no asset sits in an undeclared state and no transition is argued after the fact. An undeclared or unknown state is a finding in itself — the state machine refuses to move such an asset and the session may not proceed past it"
        proof: "python3 -m rig_capabilities.lifecycle plan --assets .rig/prune/estate.json --now <date> reports zero 'state_undeclared' and zero 'state_unrecorded' violations for the in-scope set; the estate snapshot with its per-asset state/reason/timestamp triplets is on file at .rig/prune/estate.json"
        failure_tier: halt
  - category: "Catalog & Drift Pass"
    gates:
      - id: "2.1"
        requirement: "Catalog pruner pass: skill_catalog.json, harness_catalog.json, and agent_catalog.json entries are validated against disk — every catalog row points at an existing, parseable asset; phantom rows are enumerated"
        proof: "python3 -c json-loading each catalog and asserting os.path.exists plus parse success per row; phantom list saved to .rig/prune/phantoms.txt (empty allowed, file mandatory)"
        failure_tier: halt
      - id: "2.2"
        requirement: "Doctrine drift audit: live assets are scanned for stale thresholds, dead loop references (GL-* ids that no longer exist), and superseded doctrine phrases; findings carry file:line anchors"
        proof: "grep -rnE '<known drift patterns>' over artifacts/skills/ artifacts/harnesses/ artifacts/agents/ with hits triaged in .rig/prune/drift.txt as condemn / repair / annotate"
        failure_tier: degrade
      - id: "2.3"
        requirement: "Usage telemetry check: kill-candidates justified by non-use must show a telemetry window — an asset with zero recorded invocations over the window AND a failing done-test; usage alone never condemns"
        proof: "python3 -c reading the usage telemetry log asserting each non-use condemnation cites a window length and zero-count; table in .rig/prune/usage.txt"
        failure_tier: degrade
      - id: "2.4"
        requirement: "Quantified drift scoring: drift findings that claim statistical weight are scored against the substrate rather than asserted"
        proof: "python3 ~/Developer/needle-haystack/artifacts/meta/mathexec_substrate.py deviation --score <finding_rate> --baseline <historical_rates> per quantified claim; JSON outputs in .rig/prune/drift-zscores/; self-test rerun first if substrate was not exercised this session"
        failure_tier: degrade
      - id: "2.5"
        requirement: "Marginal value measured, not assumed: for every asset in scope, U(s) = counterfactual gain of injecting it over the base policy MINUS retrieval latency, token footprint and execution overhead, from n-run with/without trials. An asset with U(s) < theta (default 0.0) MUST appear in the eviction set and reach evicted this cycle — a well-written asset that lowers estate performance is condemnable with no failing test on record, which is the class mh-05 could previously never reach"
        proof: "python3 -m rig_capabilities.lifecycle plan --assets .rig/prune/estate.json --now <date> reports zero 'utility_threshold_breached' violations; every asset whose measured U(s) < evict_utility_below appears in solvency.eviction_set; per-asset with/without run outputs in .rig/prune/utility/<asset>.json"
        failure_tier: halt
      - id: "2.6"
        requirement: "Activation-frequency decay applied as a term, not a vibe: activity(s) = uses x 0.5 ** (days since last use / half-life); activity below the floor quarantines an active asset, and a decayed asset still parked past park_max_days is evicted rather than re-parked — quarantine is never terminal. Absence of a telemetry WINDOW is reported as a blind spot, never scored as zero use"
        proof: "Same plan run reports zero 'decay_floor_breached' and zero 'park_overdue' violations; solvency.telemetry_blind lists every unrouted-worthy asset lacking a window and each has an owner line in .rig/prune/blind.txt"
        failure_tier: degrade
      - id: "2.7"
        requirement: "Negative-attribution revocation feed, independent of utility: any asset whose reuse attribution crosses the configured negative threshold, or which carries an open risk flag, enters the revocation set regardless of how well it scores or how often it runs. Revoked means un-loadable, not merely unloved: it must leave the routed set, and quarantine may not be substituted for retirement"
        proof: "Same plan run reports zero 'revocation_overridden' and zero 'revocation_missing' violations, and solvency.revocation_set == every asset whose recorded negative_attribution >= neg_revoke_at or whose open_risk_flags are non-empty; the attribution rows behind each entry are in .rig/prune/attribution.json"
        failure_tier: halt
  - category: "Approval & Execution"
    gates:
      - id: "3.1"
        requirement: "Condemnation set frozen and presented for Gate-D: the set (with per-asset evidence links: failing test output, restore archive hash, dependency sweep) is written as a single reviewable document; no deletion command is staged before approval"
        proof: ".rig/prune/condemnation.md exists with one section per asset containing the three evidence links; python3 os.path.exists assertion per link; session log states 'AWAITING GATE-D'"
        failure_tier: halt
      - id: "3.2"
        requirement: "Approval recorded: the human's explicit approval token for this exact condemnation set (content-hash matched) is on file before any delete runs"
        proof: "Approval line in session log includes sha256 of condemnation.md; recomputed hash matches; recorded to .rig/prune/approval.txt"
        failure_tier: stop
      - id: "3.3"
        requirement: "Deletion executes exactly the approved set and nothing else: the delete list is derived programmatically from the approved document, and post-delete verification confirms only approved paths are gone"
        proof: "python3 -c diffing pre/post directory listings; deleted set == approved set (set equality assertion); survivors untouched; result in .rig/prune/post-delete.txt"
        failure_tier: halt
      - id: "3.4"
        requirement: "Catalogs and dependents updated in the same transaction: removed assets' catalog rows deleted, dependent migrations applied, and every catalog still validates (gate 2.1 re-run green)"
        proof: "Re-run of the 2.1 validation script exits 0 post-delete; diff of catalog files saved to .rig/prune/catalog-diff.txt"
        failure_tier: halt
      - id: "3.5"
        requirement: "Eviction and revocation stay distinct in the executed record: an EVICTED asset leaves a verified restore point that the restore rule may return to active, while a REVOKED asset leaves a tombstone whose restore_forbidden flag is set and which has no transition back to a loadable state — only re-canonicalising under a new identity lifts it. A cut recorded without its kind, or a revoked asset that a restore archive would silently re-arm, fails this gate"
        proof: "python3 -c asserting every evicted entry has restore.point plus verified true, every revoked entry has tombstone.restore_forbidden true and its asset id absent from plan().loadable_after; python3 -m rig_capabilities.lifecycle plan --example --now <date> --plant one_way_door exits 2 with violation revocation_revived (the guard is proven to fire); .rig/prune/states-after.json"
        failure_tier: halt
  - category: "Recording"
    gates:
      - id: "4.1"
        requirement: "Prune verdict recorded to rig-memory-os with cut count, restore manifest hash, and per-asset verdicts"
        proof: "rig-memory-os memory.record_event(kind=\"asset_pruned\", cut_count=<n>, restored=<bool>, restore_manifest_sha=<hash>, verdict=<pass>) returns an event id recalled byte-for-byte; round-trip in .rig/prune/memory-roundtrip.txt"
        failure_tier: halt
      - id: "4.2"
        requirement: "Condemnation classes proposed upstream: recurring cut causes (e.g. untestable skill shapes) are submitted so genesis/forge templates harden against producing cuttable assets"
        proof: "rig-memory-os memory.propose_memory(content=\"condemnation_class\", evidence_refs=[<asset_pruned event id>]) acknowledged; ack id in .rig/prune/proposal.txt"
        failure_tier: degrade
      - id: "4.3"
        requirement: "Library solvency line recorded, so the weekly gate can fail on an unsolvable library: the plan's solvency projection (asset count, routed before/after, eviction set, revocation set, telemetry-blind set) is persisted next to the verdict, and an INSOLVENT verdict is surfaced rather than rounded into a pass"
        proof: "solvency JSON from the plan run saved to .rig/prune/solvency.json and echoed into the rig-memory-os prune event (kind=\"asset_pruned\", solvency=<verdict>, eviction_count=<n>, revocation_count=<n>); consumed by capabilities/loops/rig-realign-weekly.md as its library-solvency line; file recalled byte-for-byte"
        failure_tier: degrade
  - category: "Plan Discipline"
    gates:
      - id: "5.1"
        requirement: "The lifecycle plan is advisory only: proposing transitions performs no filesystem write, no deletion, and no install-ledger mutation. Condemnation is a text projection; execution remains behind gates 3.1-3.4 and Gate-D"
        proof: "python3 -m unittest tests.test_lifecycle exits 0 and includes the write-free case that patches open/write_text/unlink/makedirs/rename/rmtree to raise for the duration of plan() and hashes a sentinel tree before and after; sha256 of the snapshot compared in .rig/prune/plan-purity.txt"
        failure_tier: halt
      - id: "5.2"
        requirement: "Every lifecycle rule is proven capable of going RED: each named plant (revocation, utility_evict, decay_quarantine, decay_evict, one_way_door, record_reason, tombstone, state_record) must turn the reference estate INSOLVENT with its expected violation named, and none may report itself inert. A plant that changes nothing is theater and fails the gate"
        proof: "for p in $(python3 -m rig_capabilities.lifecycle rules | sed -n 's/^plants: //p' | tr ',' ' '); do python3 -m rig_capabilities.lifecycle plan --example --now <date> --plant $p > /dev/null || rc=$?; done with rc 2 for all eight and empty plants_inert; per-plant output in .rig/prune/plants/<plant>.json"
        failure_tier: halt
definition_of_done:
  - "All gates passed or degraded-with-log; zero unresolved halt gates, zero stop events"
  - "Every deleted asset had a recorded failing done-test, a verified restore archive, and a clean dependency sweep"
  - "Gate-D approval on file, content-hash matched to the exact condemnation set"
  - "Post-delete verification: deleted set == approved set; all catalogs re-validate green"
  - "asset_pruned event recorded and round-trip verified; condemnation classes proposed"
  - "Every in-scope asset ended the session in a declared lifecycle state with a recorded reason and timestamp; zero assets in an undeclared state"
  - "Eviction set == every asset with measured U(s) < theta or decayed activity past the park window; revocation set == every asset past the negative-attribution threshold or carrying an open risk flag; zero routed assets in either set"
  - "Solvency line persisted and truthful: an INSOLVENT verdict is reported as INSOLVENT"
  - "One improvement entry appended to the improvements log"
failure_protocol:
  halt_gates: ["1.1", "1.2", "1.3", "1.4", "2.1", "2.5", "2.7", "3.1", "3.3", "3.4", "3.5", "4.1", "5.1", "5.2"]
  degrade_gates: ["2.2", "2.3", "2.4", "2.6", "4.2", "4.3"]
  stop_gates: ["3.2"]
  notes: "stop on 3.2: any deletion attempted without a hash-matched Gate-D approval halts the session AND triggers restore from .rig/prune/restore/ — an unapproved cut is treated as damage, not progress. A prune session that finds zero condemnable assets is a valid PASS outcome and records cut_count=0. Exception to the Gate-D rule: revoking (un-routing) an asset on negative attribution or an open risk flag is a safety action, executes on the recorded evidence, and is never held for approval — only removing its files is. A session that reports zero transitions while assets sit in undeclared states, below theta, or past the attribution threshold is not a clean session, it is an unsolvable library reported as one"
self_improvement:
  log_path: "~/.hermes/jake/improvements.log"
  pattern_cadence: 5
  update_trigger: "the same condemnation class recurs in 3+ prune sessions → the producing template (genesis or forge) is patched; restore archives never needed in 10 sessions → archive cadence is reviewed but never dropped; theta or the decay half-life retuned twice in one month → the utility measurement itself (not the threshold) is the defect and the with/without harness is repaired first"
final_rule:
  - "No failing done-test on record, no condemnation — unless measured value or negative attribution condemns it, which needs no failing test."
  - "Restore is proven before the cut, not promised after."
  - "The approved set and the deleted set are the same set, proven by diff."
  - "Evicted means restorable; revoked means un-loadable. Never record one as the other."
  - "Retention is computed. An asset nobody can show a counterfactual gain for is a cost, however good its prose."
  - "Every asset-pruning session leaves the system stronger than it found it."
governs_loops: [GL-VQ, GL-GG, GL-OF]
