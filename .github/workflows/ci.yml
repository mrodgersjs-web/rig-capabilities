name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
        deps: [stdlib, yaml]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "yaml" ]; then
            pip install -e ".[test,yaml]"
          else
            pip install -e ".[test]"   # runtime stays stdlib-only; loop.json fallback
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Ephemeral signing key for the IdP/pack-signing gates
        # Throwaway per-run key so idp_integrity exercises issue -> verify -> tamper.
        run: echo "RIG_CAPABILITIES_SIGNING_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: Tests (full suite minus live-estate tests)
        run: python -m pytest -m "not live_estate" -rs

      - name: Smoke - MCP server over stdio, real catalog query
        run: python scripts/smoke_mcp.py

      - name: Smoke - CLI catalog lookup and loop-skill planted-failure cases
        run: |
          ./bin/rig-capabilities stats
          ./bin/rig-capabilities get proof-loop
          ./bin/rig-loop test proof-loop
