<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">rig-capabilities architecture</title><desc id="desc">Canonical capabilities and read-only external sources are scanned into a JSON index. Agent packs resolve against that index. MCP and CLI surfaces expose the catalog. Loop CLI reads specs directly. Wiring registers five harnesses and syncs commands and hooks. Canonical installs are logged separately.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6E7781"/></marker><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#087C93"/></marker></defs><rect width="1200" height="620" fill="#FFFFFF"/><g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<text x="32" y="43" fill="#1F2328" font-size="30" font-weight="700">One catalog. Five harnesses.</text>
<text x="32" y="74" fill="#59636E" font-size="17" font-weight="500">Source-backed discovery, separate install records, shared MCP access.</text>
<text x="32" y="116" fill="#59636E" font-size="15" font-weight="700">SOURCES</text>
<path d="M32 127H278" stroke="#D0D7DE"/>
<text x="324" y="116" fill="#59636E" font-size="15" font-weight="700">CORE</text>
<path d="M324 127H602" stroke="#D0D7DE"/>
<text x="635" y="116" fill="#59636E" font-size="15" font-weight="700">SURFACES</text>
<path d="M635 127H905" stroke="#D0D7DE"/>
<text x="951" y="116" fill="#59636E" font-size="15" font-weight="700">HARNESSES</text>
<path d="M951 127H1168" stroke="#D0D7DE"/>
<rect x="32" y="145" width="246" height="95" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="32" y="161" width="3" height="63" rx="1.5" fill="#7C5CFF"/>
<text x="48" y="173" fill="#1F2328" font-size="18" font-weight="650">capabilities/</text>
<text x="48" y="198" fill="#59636E" font-size="15" font-weight="500">Skills, hooks, harnesses,</text>
<text x="48" y="220" fill="#59636E" font-size="15" font-weight="500">loops and commands</text>
<rect x="32" y="277" width="246" height="100" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="32" y="293" width="3" height="68" rx="1.5" fill="#087C93"/>
<text x="48" y="305" fill="#1F2328" font-size="18" font-weight="650">External roots</text>
<text x="48" y="330" fill="#59636E" font-size="15" font-weight="500">config.json + built-in defaults</text>
<text x="48" y="352" fill="#59636E" font-size="15" font-weight="500">Read-only scan; canonical wins</text>
<rect x="32" y="410" width="246" height="78" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="32" y="426" width="3" height="46" rx="1.5" fill="#7C5CFF"/>
<text x="48" y="438" fill="#1F2328" font-size="18" font-weight="650">agents/&lt;id&gt;/pack.json</text>
<text x="48" y="463" fill="#59636E" font-size="15" font-weight="500">Named capability references</text>
<rect x="324" y="145" width="278" height="95" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="324" y="161" width="3" height="63" rx="1.5" fill="#7C5CFF"/>
<text x="340" y="173" fill="#1F2328" font-size="18" font-weight="650">Indexer · catalog.py</text>
<text x="340" y="198" fill="#59636E" font-size="15" font-weight="500">scan() → build_index()</text>
<text x="340" y="220" fill="#59636E" font-size="15" font-weight="500">Metadata, hashes, deduplication</text>
<rect x="324" y="277" width="278" height="100" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="324" y="293" width="3" height="68" rx="1.5" fill="#7C5CFF"/>
<text x="340" y="305" fill="#1F2328" font-size="18" font-weight="650">.index.json</text>
<text x="340" y="330" fill="#59636E" font-size="15" font-weight="500">Generated search cache</text>
<text x="340" y="352" fill="#59636E" font-size="15" font-weight="500">load_index() refreshes if stale</text>
<rect x="324" y="410" width="278" height="78" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="324" y="426" width="3" height="46" rx="1.5" fill="#7C5CFF"/>
<text x="340" y="438" fill="#1F2328" font-size="18" font-weight="650">Pack resolver · packs.py</text>
<text x="340" y="463" fill="#59636E" font-size="15" font-weight="500">Resolve IDs against the index</text>
<rect x="324" y="516" width="278" height="48" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="324" y="532" width="3" height="16" rx="1.5" fill="#3FB950"/>
<text x="340" y="544" fill="#1F2328" font-size="18" font-weight="650">.install.json</text>
<rect x="635" y="145" width="270" height="95" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="635" y="161" width="3" height="63" rx="1.5" fill="#7C5CFF"/>
<text x="651" y="173" fill="#1F2328" font-size="18" font-weight="650">MCP server · 29 tools</text>
<text x="651" y="198" fill="#59636E" font-size="15" font-weight="500">server.py + mcp_stdio.py</text>
<text x="651" y="220" fill="#59636E" font-size="15" font-weight="500">stdio · JSON-RPC 2.0</text>
<rect x="635" y="277" width="270" height="100" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="635" y="293" width="3" height="68" rx="1.5" fill="#7C5CFF"/>
<text x="651" y="305" fill="#1F2328" font-size="18" font-weight="650">bin/rig-capabilities</text>
<text x="651" y="330" fill="#59636E" font-size="15" font-weight="500">Search, get, reindex, install,</text>
<text x="651" y="352" fill="#59636E" font-size="15" font-weight="500">agent-pack and other commands</text>
<rect x="635" y="410" width="270" height="78" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="635" y="426" width="3" height="46" rx="1.5" fill="#7C5CFF"/>
<text x="651" y="438" fill="#1F2328" font-size="18" font-weight="650">bin/rig-loop</text>
<text x="651" y="463" fill="#59636E" font-size="15" font-weight="500">Specs → stages → gates → seal</text>
<rect x="635" y="516" width="270" height="48" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="635" y="532" width="3" height="16" rx="1.5" fill="#7C5CFF"/>
<text x="651" y="544" fill="#1F2328" font-size="18" font-weight="650">wire/wire.py</text>
<rect x="951" y="145" width="217" height="419" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="951" y="161" width="3" height="387" rx="1.5" fill="#087C93"/>
