<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">One MCP server, five coding harnesses</title>
<desc id="desc">Claude Code: ~/.claude.json and ~/.claude/CLAUDE.md, JSON and Markdown. Codex: ~/.codex/config.toml and ~/.codex/AGENTS.md, TOML and Markdown. OMP: ~/.omp/agent/mcp.json, JSON. Hermes: ~/.hermes/config.yaml, YAML. Prime Agent: ~/.prime/agent/settings.json and ~/.prime/agent/AGENTS.md, JSON and Markdown.</desc>
<style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#E6EDF3}.heading{font-size:22px;font-weight:700}.name{font-size:21px;font-weight:700}.path{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:15px;font-weight:600}.format{font-size:16px;font-weight:700;fill:#BBAAFF}.card{fill:#111722;stroke:#30363D;stroke-width:1}.glyph{fill:none;stroke:#22D3EE;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.badge{fill:#201938}</style>
<rect width="1200" height="260" fill="#0B0F17"/>
<text x="16" y="33" class="heading">One MCP server. Five harnesses.</text>
<g transform="translate(16 54)"><rect class="card" width="224" height="190" rx="14"/><g class="glyph" transform="translate(18 22)"><rect x="1" y="1" width="28" height="28" rx="4"/><path d="M8 15h14M15 8v14"/></g><text class="name" x="58" y="43">Claude Code</text><text class="path" x="16" y="82">~/.claude.json</text><text class="path" x="16" y="105">~/.claude/CLAUDE.md</text><rect class="badge" x="16" y="145" width="192" height="30" rx="7"/><text class="format" x="28" y="165">JSON + Markdown</text></g>
<g transform="translate(252 54)"><rect class="card" width="224" height="190" rx="14"/><g class="glyph" transform="translate(18 22)"><path d="m10 4-8 11 8 11M20 4l8 11-8 11M17 2l-4 26"/></g><text class="name" x="58" y="43">Codex</text><text class="path" x="16" y="82">~/.codex/config.toml</text><text class="path" x="16" y="105">~/.codex/AGENTS.md</text><rect class="badge" x="16" y="145" width="192" height="30" rx="7"/><text class="format" x="28" y="165">TOML + Markdown</text></g>
<g transform="translate(488 54)"><rect class="card" width="224" height="190" rx="14"/><g class="glyph" transform="translate(18 22)"><circle cx="15" cy="15" r="14"/><path d="m8 10 5 5-5 5M17 20h6"/></g><text class="name" x="58" y="43">OMP</text><text class="path" x="16" y="82">~/.omp/agent/mcp.json</text><rect class="badge" x="16" y="145" width="192" height="30" rx="7"/><text class="format" x="28" y="165">JSON</text></g>
<g transform="translate(724 54)"><rect class="card" width="224" height="190" rx="14"/><g class="glyph" transform="translate(18 22)"><path d="m15 1 14 7v14l-14 7-14-7V8Z"/><path d="M1 8l14 7 14-7M15 15v14"/></g><text class="name" x="58" y="43">Hermes</text><text class="path" x="16" y="82">~/.hermes/config.yaml</text><rect class="badge" x="16" y="145" width="192" height="30" rx="7"/><text class="format" x="28" y="165">YAML</text></g>
<g transform="translate(960 54)"><rect class="card" width="224" height="190" rx="14"/><g class="glyph" transform="translate(18 22)"><path d="m15 1 14 14-14 14L1 15Z"/><circle cx="15" cy="15" r="5"/></g><text class="name" x="58" y="43">Prime Agent</text><text class="path" x="16" y="82">~/.prime/agent/</text><text class="path" x="28" y="105">settings.json</text><text class="path" x="28" y="128">AGENTS.md</text><rect class="badge" x="16" y="145" width="192" height="30" rx="7"/><text class="format" x="28" y="165">JSON + Markdown</text></g>
