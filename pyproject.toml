[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-capabilities"
version = "42.0.0"
description = "Canonical, git-versioned RIG capability store: skills, agents, hooks, goal harnesses, loop-skills, commands; MCP server + rig-loop engine. Stdlib only."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["rig_capabilities"]

[tool.rig]
tests = "python3 -m unittest discover -s tests"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_estate: needs the operator's live estate (external corpus roots, local Postgres on :5433); deselected in CI",
]

[tool.ruff]
target-version = "py39"
extend-exclude = [".venv*", "out", "examples/great"]

[tool.ruff.lint]
# Correctness rules only (pyflakes + syntax/runtime errors); style is not gated.
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "E731", "E741"]  # style-only in this codebase
