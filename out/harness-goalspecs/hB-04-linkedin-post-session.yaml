          "description": "Refuse engagement-bait mechanics ('comment YES', 'repost if') outright \u2014 session degrades if requested.",
          "command": null,
          "failure_tier": "halt",
          "required": true,
          "required_verdict": "GO",
          "weight": 1.0
        },
        {
          "id": "IG-04",
          "category": "Identity Lock",
          "name": "IG-04 Confirm whether the post pairs with a visual; decide before",
          "description": "Confirm whether the post pairs with a visual; decide before writing, not after.",
          "command": null,
          "failure_tier": "halt",
          "required": true,
          "required_verdict": "GO",
          "weight": 1.0
        },
        {
          "id": "CG-01",
          "category": "Capability",
          "name": "CG-01 Pillar & angle lock",
          "description": "Post pillar and one-sentence angle recorded in angle.yaml.",
          "command": "$SESS/angle.yaml parses with keys pillar, angle; `python3 -c \"import yaml;a=yaml.safe_load(open('$SESS/angle.yaml'));assert a['pillar'] in ['build','lesson','contrarian','receipt']\"` exits 0",
          "failure_tier": "halt",
          "required": true,
          "required_verdict": "GO",
          "weight": 1.0
        },
        {
          "id": "CG-02",
          "category": "Capability",
          "name": "CG-02 Hook strength",
          "description": "First two lines <=210 chars total, contain a number, a proper noun, or a tension statement; no question-hook two posts in a row (check log).",
          "command": "`python3 scripts/hook_check.py $SESS/post.md --log ~/.rig/logs/linkedin_hooks.jsonl` exits 0",
          "failure_tier": "halt",
          "required": true,
          "required_verdict": "GO",
          "weight": 1.0
        },
        {
          "id": "CG-03",
          "category": "Capability",
          "name": "CG-03 Length & format band",
          "description": "Post 900-1,300 chars for text-only or 400-700 when paired with visual; line breaks every 1-2 sentences.",
          "command": "`python3 scripts/li_format.py $SESS/post.md --mode $(grep mode $SESS/angle.yaml|cut -d' ' -f2)` exits 0",
          "failure_tier": "degrade",
          "required": false,
          "required_verdict": "SOFT",
          "weight": 0.5
        },
        {
          "id": "CG-04",
          "category": "Capability",
          "name": "CG-04 Receipt requirement",
          "description": "Posts in receipt/lesson pillars contain at least one concrete artifact reference (metric, screenshot reference, date, or named tool version).",
          "command": "`grep -cE '[0-9]+%|[0-9]+x|v[0-9]+\\.[0-9]+|20[0-9]{2}-[0-9]{2}' $SESS/post.md` >= 1",
          "failure_tier": "halt",
          "required": true,
          "required_verdict": "GO",
          "weight": 1.0
        },
        {
          "id": "CG-05",
          "category": "Capability",
          "name": "CG-05 Voice fingerprint",
          "description": "Banned-token scan clean; signature-vocab density within profile band.",
          "command": "`grep -ciE 'delve|thrilled to announce|humbled|game changer' $SESS/post.md` == 0 AND `python3 scripts/voice_fp.py $SESS/post.md` exits 0",
          "failure_tier": "halt",
          "required": true,
          "required_verdict": "GO",
          "weight": 1.0
        },
        {
          "id": "CG-06",
          "category": "Capability",
          "name": "CG-06 Close integrity",
          "description": "Final line is a single conversation prompt <=80 chars; zero external links in body (links go to first comment if required).",
          "command": "`tail -1 $SESS/post.md | wc -c` <= 80; `grep -cE 'https?://' $SESS/post.md` == 0 OR links documented in $SESS/first_comment.txt",
          "failure_tier": "degrade",
          "required": false,
          "required_verdict": "SOFT",
          "weight": 0.5
        },
        {
          "id": "CG-07",
          "category": "Capability",
          "name": "CG-07 Hashtag discipline",
          "description": "0-3 hashtags, all lowercase, none invented-for-this-post (must exist in profile hashtag registry).",
          "command": "`grep -oE '#[A-Za-z0-9]+' $SESS/post.md | wc -l` <= 3 AND each found via `grep -F` in $SESS/hashtag_registry.txt",
          "failure_tier": "degrade",
          "required": false,
          "required_verdict": "SOFT",
          "weight": 0.5
        },
        {
          "id": "CG-08",
          "category": "Capability",
          "name": "CG-08 Visual pairing proof",
          "description": "If mode=visual, the asset exists at spec (1080x1350 or 1200x627) and its sha256 is recorded.",
          "command": "For visual mode: `file $SESS/asset.png` confirms PNG AND `python3 scripts/img_size.py $SESS/asset.png --allow 1080x1350,1200x627` exits 0; hash in $SESS/proof/asset.sha256",
          "failure_tier": "degrade",
          "required": false,
          "required_verdict": "SOFT",
          "weight": 0.5
        },
        {
          "id": "CG-09",
          "category": "Capability",
          "name": "CG-09 Proof packet seal",
          "description": "Post, angle, and asset hashes sealed; hook appended to hook log for anti-repetition.",
          "command": "`sha256sum -c $SESS/proof/packet.sha256` exits 0; `tail -1 ~/.rig/logs/linkedin_hooks.jsonl | grep -c $(sha256sum $SESS/post.md|cut -d' ' -f1)` >= 1",
          "failure_tier": "halt",
          "required": true,
          "required_verdict": "GO",
          "weight": 1.0
        }
      ],
