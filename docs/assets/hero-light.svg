<rect x="405" y="299" width="175" height="35" rx="9" fill="#F8F9FE" stroke="#D0D7DE"/><text x="492.5" y="321.5" text-anchor="middle" fill="#1F2328" font-size="14" font-weight="650">Python stdlib only</text>
<rect x="592" y="299" width="65" height="35" rx="9" fill="#F8F9FE" stroke="#D0D7DE"/><text x="624.5" y="321.5" text-anchor="middle" fill="#1F2328" font-size="14" font-weight="650">MIT</text>
