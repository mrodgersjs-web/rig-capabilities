<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Proof loop: done is proven</title><desc id="desc">Claim, Evidence, Non-vacuity, Verify and Proof. Non-vacuity catches a planted failure. A failed Evidence, Non-vacuity or Verify stage returns to Claim; three iterations maximum. Proof requires a sealed packet.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78889B"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF7B72"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3FB950"/></marker></defs><rect width="1200" height="340" fill="#0B0F17"/><g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><text x="32" y="43" fill="#E6EDF3" font-size="30" font-weight="700">Done is proven. Never just claimed.</text><text x="32" y="74" fill="#AEB9C6" font-size="17" font-weight="500">Executable checks, a planted failure, an independent verdict, then a sealed ProofPacket.</text><path d="M240 150H261" stroke="#78889B" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="111" width="208" height="78" rx="14" fill="#111925" stroke="#30363D"/><rect x="32" y="127" width="3" height="46" rx="1.5" fill="#7C5CFF"/><text x="48" y="140" fill="#E6EDF3" font-size="19" font-weight="700">C · Claim</text><text x="48" y="166" fill="#AEB9C6" font-size="15" font-weight="500">Executable done-test</text><path d="M472 150H493" stroke="#78889B" stroke-width="2" marker-end="url(#arrow)"/><rect x="264" y="111" width="208" height="78" rx="14" fill="#111925" stroke="#30363D"/><rect x="264" y="127" width="3" height="46" rx="1.5" fill="#7C5CFF"/><text x="280" y="140" fill="#E6EDF3" font-size="19" font-weight="700">E · Evidence</text><text x="280" y="166" fill="#AEB9C6" font-size="15" font-weight="500">Checks green now</text><path d="M704 150H725" stroke="#78889B" stroke-width="2" marker-end="url(#arrow)"/><rect x="496" y="111" width="208" height="78" rx="14" fill="#111925" stroke="#30363D"/><rect x="496" y="127" width="3" height="46" rx="1.5" fill="#7C5CFF"/><text x="512" y="140" fill="#E6EDF3" font-size="19" font-weight="700">N · Non-vacuity</text><text x="512" y="166" fill="#AEB9C6" font-size="15" font-weight="500">Proven RED → GREEN</text><path d="M936 150H957" stroke="#78889B" stroke-width="2" marker-end="url(#arrow)"/><rect x="728" y="111" width="208" height="78" rx="14" fill="#111925" stroke="#30363D"/><rect x="728" y="127" width="3" height="46" rx="1.5" fill="#7C5CFF"/><text x="744" y="140" fill="#E6EDF3" font-size="19" font-weight="700">V · Verify</text><text x="744" y="166" fill="#AEB9C6" font-size="15" font-weight="500">Independent verdict</text><rect x="960" y="111" width="208" height="78" rx="14" fill="#10231B" stroke="#3FB950"/><rect x="960" y="127" width="3" height="46" rx="1.5" fill="#3FB950"/><text x="976" y="140" fill="#E6EDF3" font-size="19" font-weight="700">P · Proof</text><text x="976" y="166" fill="#3FB950" font-size="15" font-weight="500">Hash-bound seal</text><path d="M560 189V207" fill="none" stroke="#FF7B72" stroke-width="2" marker-end="url(#red)"/><rect x="490" y="213" width="220" height="36" rx="12" fill="#23181F" stroke="#FF7B72"/><text x="600" y="237" text-anchor="middle" fill="#FF7B72" font-size="16" font-weight="650">Planted failure caught</text><path d="M710 231H720V200H650V192" fill="none" stroke="#3FB950" stroke-width="2" marker-end="url(#green)"/><path d="M832 189V270H136V192" fill="none" stroke="#FF7B72" stroke-width="2" marker-end="url(#red)"/><path d="M368 189V270" fill="none" stroke="#FF7B72" stroke-width="2"/><path d="M1135 134l6 6 11-13" fill="none" stroke="#3FB950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="299" fill="#FF7B72" font-size="15" font-weight="650">FAILED / FEEDBACK → mark stage fail → return to Claim</text><text x="32" y="324" fill="#AEB9C6" font-size="14">Closing loop: E, N, V → C · max 3 iterations, then escalate · independence is recorded, not proven</text></g></svg>