---
tier: main
parent: ds-studio-session
outcome: "design-ux: Landing page run with every gate evidenced by a file or command output"
done_when:
  - file:capabilities/harnesses/ds-landing-page.yaml
  - cmd:./bin/rig-capabilities goal-spec --stem ds-landing-page
quality_floor: 0.6
---

harness_id: ds-landing-page
coordinate_space:
  levels: [L3, L4]
  diamonds: [D2, D3]
  bms_modes: [A1, A2]
  iqrsqpi_steps: [I, Q, R, S, Q2, P, I2]
harness_name: Landing page
session_type: landing-page
jev_first: 'Typed judgments at every gate go to rig-s1gate (Jev) before any frontier LLM call; classifier down means DEFERRED, never a guessed verdict.'
identity_lock:
  startup_phrase: 'Landing page: one buyer, one ask, proof above the fold.'
  gates:
  - id: '0.1'
    requirement: Load design-studio-os and state the mode (BUILD, REDESIGN, CRITIQUE, FIX, LEARN) before any work
  - id: '0.2'
    requirement: Goal card written to artifacts/<slug>/goal-card.yaml with buyer, success metric and an executable done_test
capability_gates:
- category: Brief
  gates:
  - id: '1.1'
    requirement: 'Brief names buyer, job to be done, success metric and constraints'
    proof: 'artifacts/<slug>/brief.md with all four fields non-empty'
    failure_tier: halt
  - id: '1.2'
    requirement: 'At least 3 reference sites studied with the pattern extracted, not copied'
    proof: 'artifacts/<slug>/references.md with URL and pattern per row'
    failure_tier: degrade
  - id: '1.3'
    requirement: 'Brief judged ready by Jev plan.readiness'
    proof: 'decision id recorded in artifacts/<slug>/gates.md'
    failure_tier: halt
- category: Conversion
  gates:
  - id: '5.1'
    requirement: 'Hero states who it is for, the outcome and one call to action'
    proof: 'artifacts/<slug>/hero.md checked by ds-copywriter'
    failure_tier: halt
  - id: '5.2'
    requirement: 'Proof (named results, logos, testimonials) placed before the second ask'
    proof: 'section order in artifacts/<slug>/layout.md'
    failure_tier: degrade
- category: Craft
  gates:
  - id: '2.1'
    requirement: 'Type scale and pairing chosen from ds-typography laws, each choice citing a law'
    proof: 'artifacts/<slug>/type.md with CLAIM citations'
    failure_tier: halt
  - id: '2.2'
    requirement: 'Palette tokens pass contrast 4.5:1 body and 3:1 large/UI'
    proof: 'contrast table from ds-contrast-checker, exit 0'
    failure_tier: halt
  - id: '2.3'
    requirement: 'Layout on a stated grid with spacing on the scale'
    proof: 'artifacts/<slug>/layout.md lists grid, scale and exceptions'
    failure_tier: degrade
- category: Critique
  gates:
  - id: '3.1'
    requirement: 'Real rendered screens captured at 375, 768 and 1440 px'
    proof: 'three PNGs in artifacts/<slug>/captures/'
    failure_tier: halt
  - id: '3.2'
    requirement: 'Independent critic (ds-critic, not the builder) returns findings with laws cited'
    proof: 'artifacts/<slug>/critique.md'
    failure_tier: halt
  - id: '3.3'
    requirement: 'Jev ui.design and advisor-plus judge-image run on each capture'
    proof: 'decision ids per capture; DEFERRED listed as DEFERRED'
    failure_tier: halt
  - id: '3.4'
    requirement: 'Anti-slop lint clean on all copy'
    proof: 'ds-slop-linter output with 0 blockers'
    failure_tier: degrade
- category: Ship
  gates:
  - id: '4.1'
    requirement: 'Production build served locally and clicked through'
    proof: 'command output plus capture of the served URL'
    failure_tier: halt
  - id: '4.2'
    requirement: 'Performance and accessibility checks recorded'
    proof: 'lighthouse or equivalent JSON in artifacts/<slug>/'
    failure_tier: degrade
  - id: '4.3'
    requirement: 'Gate-D request filed for any publish or deploy'
    proof: 'gate_d request id in artifacts/<slug>/gates.md'
    failure_tier: halt
definition_of_done:
- All halt gates evidenced
- Findings or deliverables cite laws or are labeled own reasoning
failure_protocol:
  halt_gates:
  - '1.1'
  - '5.1'
  - '2.2'
  - '3.2'
  - '4.3'
final_rule:
- No gate evidence, no progress.
- A DEFERRED Jev verdict is never a pass.
- Publish, deploy, push or send needs Gate-D approval from Mike.
