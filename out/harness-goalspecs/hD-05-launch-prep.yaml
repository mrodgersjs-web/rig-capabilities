          "failure_tier": "halt",
          "required": true,
          "required_verdict": "GO",
          "weight": 1.0
        },
        {
          "id": "3.4",
          "category": "Risk & Approval",
          "name": "3.4 Gate-D arming for go-live: typed APPROVE <run_id> recorded b",
