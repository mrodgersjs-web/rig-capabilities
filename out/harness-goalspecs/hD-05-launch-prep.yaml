          "required": true,
          "required_verdict": "GO",
          "weight": 1.0
        },
        {
          "id": "3.3",
          "category": "Risk & Approval",
          "name": "3.3 Go/No-Go verdict computed: readiness score = verified items",
          "description": "Go/No-Go verdict computed: readiness score = verified items / total items, threshold per tier (T1: 1.0, T2: 0.95, T3: 0.9)",
