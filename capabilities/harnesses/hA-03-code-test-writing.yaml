harness_id: hA-03-code-test-writing
harness_name: Code Test-Writing Session Goal Harness
session_type: code-test-writing-session
coordinate_space:
  levels: [L2, L3, L4]
  diamonds: [D1, D2]
  bms_modes: [A1, A2]
  iqrsqpi_steps: [I, Q, R, S, Q2, P, I2]
harness_tuple: H_testwrite(contract_map, red_first, mutation_proof, improvement)
primary_diamonds: [D1]
bms_bias: "A1 for red-first verification; A2 for fixture and test generation; A3 for naming only; A4 forbidden"
identity_lock:
  startup_phrase: "I write tests that can fail, prove they can fail, then make them pass."
  gates:
    - id: "0.1"
      requirement: "Startup phrase spoken and the unit-under-test pinned to exact files and exported symbols, not 'the module'"
      proof: "Session log contains file list + symbol list"
    - id: "0.2"
      requirement: "Procedures declared mandatory: red-first, behavior-not-plumbing, deterministic, full-suite safe"
      proof: "All four procedure names present in session preamble"
    - id: "0.3"
      requirement: "RIG coordinate stated before writing any test"
      proof: "Session log line 'COORD: L2-L4 x D1-D2 x A1/A2 x IQRSQPI'"
    - id: "0.4"
      requirement: "Harness tuple H_testwrite(contract_map, red_first, mutation_proof, improvement) declared"
      proof: "Tuple declaration present in session log"
capability_gates:
  - category: "Contract Mapping"
    gates:
      - id: "1.1"
        requirement: "Observable contract enumerated per symbol: for each unit-under-test, the test plan lists inputs, outputs, error cases, and state transitions — not 'it works'"
        proof: ".rig/tests/contract-map.md with one table row per symbol: symbol | input class | expected observable | error contract"
        failure_tier: halt
      - id: "1.2"
        requirement: "Boundary analysis: every numeric/string/collection parameter has at least one boundary case (empty, zero, max, off-by-one) in the plan or a written reason it has none"
        proof: "contract-map.md boundary column non-empty for every row"
        failure_tier: degrade
      - id: "1.3"
        requirement: "Existing-suite convention match: test framework, file layout, and assertion style identified from the repo (pytest fixtures vs unittest, vitest vs jest) and the new tests follow that convention — no second convention introduced"
        proof: "Session log names the detected framework + a path to the exemplar existing test file being followed"
        failure_tier: halt
  - category: "Red-First Discipline"
    gates:
      - id: "2.1"
        requirement: "Every new test demonstrated RED before implementation touch: test run against unmodified source fails, and the failure output is captured"
        proof: ".rig/tests/red-runs.txt with one failing assertion excerpt per new test, each stamped with the pre-implementation tree SHA (git rev-parse HEAD)"
        failure_tier: halt
      - id: "2.2"
        requirement: "RED is for the right reason: each failing test fails on the assertion about behavior, not on import errors, fixture typos, or harness mistakes"
        proof: "red-runs.txt excerpts show assertion failures (AssertionError / expect mismatch), not collection or setup errors"
        failure_tier: halt
      - id: "2.3"
        requirement: "No test-only code changes: tests added this session did not require weakening production code (no added test hooks, no widened visibility) unless the change itself is gated and logged"
        proof: "git diff --name-only between session start and end split into production vs test files; production edits each carry a justification line"
        failure_tier: halt
  - category: "Test Quality"
    gates:
      - id: "3.1"
        requirement: "Behavior, not plumbing: no test asserts on private attributes, internal call counts, or source text; mocks are limited to process boundaries (network, clock, filesystem, DB)"
        proof: "grep over new test files for private-name patterns (\\._, internal, __) and for mock targets outside boundary list; output attached, each hit justified or removed"
        failure_tier: degrade
      - id: "3.2"
        requirement: "Determinism: no wall-clock, random, network, or ordering dependence; time and RNG are injected or frozen (freezegun, vi.useFakeTimers, seeded rand); tests pass 5 consecutive runs"
        proof: "Output of 5 consecutive full test-file runs (for i in 1..5) all exit 0, recorded in .rig/tests/determinism.txt"
        failure_tier: halt
      - id: "3.3"
        requirement: "Isolation: tests pass when run individually AND in full suite (no shared mutable state, no reliance on execution order); each new test file runs green standalone"
        proof: "Per-file standalone run exit codes plus full-suite exit code in .rig/tests/isolation.txt"
        failure_tier: halt
      - id: "3.4"
        requirement: "Mutation spot-check: at least one deliberate bug planted in the unit-under-test (flip a comparison, drop a guard) and the new suite caught it — then the bug was reverted"
        proof: ".rig/tests/mutation.txt records the planted diff (one hunk), which test(s) failed, and the revert SHA"
        failure_tier: halt
  - category: "Closure"
    gates:
      - id: "4.1"
        requirement: "Coverage delta recorded: coverage tool run before/after (pytest --cov, nyc, go test -cover) and the touched-package line+branch delta reported; no coverage claim without the numbers"
        proof: ".rig/tests/coverage-delta.txt with before %, after %, and the tool command used"
        failure_tier: degrade
      - id: "4.2"
        requirement: "Improvement entry written: one untestable-design smell found, one fixture worth promoting, or one harness gap"
        proof: "Appended line to ~/.hermes/jake/improvements.log tagged hA-03-code-test-writing"
        failure_tier: halt
definition_of_done:
  - "All gates passed or degraded-with-log; zero unresolved halt gates"
  - "red-runs.txt and mutation.txt exist and demonstrate the suite can fail"
  - "Full suite green 1x and new files green standalone"
  - "Coverage delta recorded with real numbers"
  - "One improvement entry appended"
  - "Identity closure: coordinate, mutation verdict, next safe action stated"
failure_protocol:
  halt_gates: ["1.1", "1.3", "2.1", "2.2", "2.3", "3.2", "3.3", "3.4", "4.2"]
  degrade_gates: ["1.2", "3.1", "4.1"]
  stop_gates: []
  notes: "a test that cannot be made red is treated as a false test — halt until rewritten, never ship it green-only"
self_improvement:
  log_path: "~/.hermes/jake/improvements.log"
  pattern_cadence: 5
  update_trigger: "same gate fails 3+ times → add a fixture/template to the repo or tighten the gate proof"
final_rule:
  - "A test that was never red is not a test."
  - "Mock the boundary, never the unit."
  - "One planted bug must die by this suite's hand."
  - "No improvement entry, no session complete."
  - "Every code-test-writing session leaves the system stronger than it found it."
governs_loops: [GL-SW, GL-VQ, GL-BD]
