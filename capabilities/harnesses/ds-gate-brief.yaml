---
tier: sub
parent: ds-website-build
outcome: "design-ux: Brief gate run with every gate evidenced by a file or command output"
done_when:
  - file:capabilities/harnesses/ds-gate-brief.yaml
  - cmd:./bin/rig-capabilities goal-spec --stem ds-gate-brief
quality_floor: 0.6
---

harness_id: ds-gate-brief
coordinate_space:
  levels: [L3, L4]
  diamonds: [D1, D2]
  bms_modes: [A1]
  iqrsqpi_steps: [I, Q, R, S, Q2, P, I2]
harness_name: Brief gate
session_type: gate
jev_first: 'Typed judgments at every gate go to rig-s1gate (Jev) before any frontier LLM call; classifier down means DEFERRED, never a guessed verdict.'
identity_lock:
  startup_phrase: 'Brief gate: evidence or it did not pass.'
  gates:
  - id: '0.1'
    requirement: Load design-studio-os and state the mode (BUILD, REDESIGN, CRITIQUE, FIX, LEARN) before any work
  - id: '0.2'
    requirement: Goal card written to artifacts/<slug>/goal-card.yaml with buyer, success metric and an executable done_test
capability_gates:
- category: Brief
  gates:
  - id: '1.1'
    requirement: 'Brief names buyer, job to be done, success metric and constraints'
    proof: 'artifacts/<slug>/brief.md with all four fields non-empty'
    failure_tier: halt
  - id: '1.2'
    requirement: 'At least 3 reference sites studied with the pattern extracted, not copied'
    proof: 'artifacts/<slug>/references.md with URL and pattern per row'
    failure_tier: degrade
  - id: '1.3'
    requirement: 'Brief judged ready by Jev plan.readiness'
    proof: 'decision id recorded in artifacts/<slug>/gates.md'
    failure_tier: halt
definition_of_done:
- Gate category evidenced
failure_protocol:
  halt_gates:
  - '1.1'
  - '1.3'
final_rule:
- No gate evidence, no progress.
- A DEFERRED Jev verdict is never a pass.
- Publish, deploy, push or send needs Gate-D approval from Mike.
shared_by: [ds-website-build, ds-landing-page, ds-redesign, ds-brand-identity-session, ds-critique-session]
