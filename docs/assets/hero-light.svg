<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">rig-capabilities: one capability hub for every AI coding agent</title>
<desc id="desc">Skills, hooks, harnesses, loops and commands. One MCP server. One owner per name. A central hub connects Claude Code, Codex, OMP, Hermes and Prime Agent. 29 MCP tools. 114 canonical assets. Python stdlib only. MIT.</desc>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D0D7DE" stroke-opacity=".24" stroke-width=".7"/></pattern>
<radialGradient id="aura"><stop stop-color="#7C5CFF" stop-opacity=".13"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
<radialGradient id="cyanAura"><stop stop-color="#22D3EE" stop-opacity=".13"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<linearGradient id="energy" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#6744E8"/><stop offset="1" stop-color="#087C96"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2EDFF"/><stop offset="1" stop-color="#E8FAFD"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1280" height="400" rx="16" fill="#FFFFFF"/>
<rect x=".5" y=".5" width="1279" height="399" rx="15.5" fill="url(#grid)" stroke="#D0D7DE"/>
<ellipse cx="1004" cy="193" rx="275" ry="240" fill="url(#aura)"/>
<ellipse cx="1203" cy="310" rx="240" ry="170" fill="url(#cyanAura)"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<g transform="translate(48 42)"><path d="M0 0h18M0 6h12M0 12h6" stroke="#6744E8" stroke-width="3" stroke-linecap="round"/><text x="32" y="12" fill="#535E70" font-size="13" font-weight="700" letter-spacing="2">THE CAPABILITY LAYER</text></g>
<text x="45" y="125" fill="#1F2328" font-size="74" font-weight="750" letter-spacing="-2.5">rig-capabilities<tspan fill="#6744E8">.</tspan></text>
<text x="48" y="178" fill="#1F2328" font-size="26" font-weight="600" letter-spacing="-.65">One capability hub for every AI coding agent.</text>
<text x="48" y="222" fill="#535E70" font-size="19">Skills, hooks, harnesses, loops and commands.</text>
<text x="48" y="250" fill="#535E70" font-size="19">One MCP server. One owner per name.</text>
