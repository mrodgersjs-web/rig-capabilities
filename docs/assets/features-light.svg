<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Six features of rig-capabilities</title><desc id="desc">One search surface. capabilities_search finds assets in the repo and every configured harness root. One canonical owner. Canonical entries shadow installed copies with the same ID and kind. Install with a ledger. capability_install copies to a harness root and records SHA and time in .install.json. Loops you can test. rig-loop runs planted-failure cases to check that gates catch defects. Wire five harnesses. wire.py writes managed blocks for five harnesses; dry-run is the default. Stdlib only. Runs on Python 3.9+ with no required runtime dependencies.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D0D7DE" stroke-opacity=".28" stroke-width=".7"/></pattern></defs><rect width="1200" height="520" rx="16" fill="#FFFFFF"/><rect x=".5" y=".5" width="1199" height="519" rx="15.5" fill="url(#grid)" stroke="#D0D7DE"/><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><g transform="translate(32 32)"><rect width="368" height="220" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="24" y="22" width="56" height="56" rx="14" fill="#EDE9FF"/><g transform="translate(30 27)" fill="none" stroke="#6342DE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="18" r="10"/><path d="m27 25 10 10M6 38h13M6 43h23"/></g><text x="24" y="116" font-size="23" font-weight="700" fill="#1F2328" letter-spacing="-.45">One search surface</text><text x="24" y="149" font-size="18" fill="#4D5968"><tspan x="24" dy="0">capabilities_search finds assets in</tspan><tspan x="24" dy="25">the repo and every configured</tspan><tspan x="24" dy="25">harness root.</tspan></text><circle cx="338" cy="48" r="3" fill="#087E91"/></g>
<g transform="translate(416 32)"><rect width="368" height="220" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="24" y="22" width="56" height="56" rx="14" fill="#EDE9FF"/><g transform="translate(30 27)" fill="none" stroke="#087E91" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="12" width="27" height="29" rx="4"/><path d="M15 6h25v28M14 25l5 5 9-11"/></g><text x="24" y="116" font-size="23" font-weight="700" fill="#1F2328" letter-spacing="-.45">One canonical owner</text><text x="24" y="149" font-size="18" fill="#4D5968"><tspan x="24" dy="0">Canonical entries shadow installed</tspan><tspan x="24" dy="25">copies with the same ID and kind.</tspan></text><circle cx="338" cy="48" r="3" fill="#087E91"/></g>
