---
tier: sub
parent: ds-website-build
outcome: "design-ux: Craft gate run with every gate evidenced by a file or command output"
done_when:
  - file:studio-harness/harnesses/ds-gate-craft.yaml
  - cmd:python3 tools/check_family.py
quality_floor: 0.6
---

harness_id: ds-gate-craft
harness_name: Craft gate
session_type: gate
jev_first: 'Typed judgments at every gate go to rig-s1gate (Jev) before any frontier LLM call; classifier down means DEFERRED, never a guessed verdict.'
identity_lock:
  startup_phrase: 'Craft gate: evidence or it did not pass.'
  gates:
  - id: '0.1'
    requirement: Load design-studio-os and state the mode (BUILD, REDESIGN, CRITIQUE, FIX, LEARN) before any work
  - id: '0.2'
    requirement: Goal card written to artifacts/<slug>/goal-card.yaml with buyer, success metric and an executable done_test
capability_gates:
- category: Craft
  gates:
  - id: '2.1'
    requirement: 'Type scale and pairing chosen from ds-typography laws, each choice citing a law'
    proof: 'artifacts/<slug>/type.md with CLAIM citations'
    failure_tier: halt
  - id: '2.2'
    requirement: 'Palette tokens pass contrast 4.5:1 body and 3:1 large/UI'
    proof: 'contrast table from ds-contrast-checker, exit 0'
    failure_tier: halt
  - id: '2.3'
    requirement: 'Layout on a stated grid with spacing on the scale'
    proof: 'artifacts/<slug>/layout.md lists grid, scale and exceptions'
    failure_tier: degrade
definition_of_done:
- Gate category evidenced
failure_protocol:
  halt_gates:
  - '2.1'
  - '2.2'
final_rule:
- No gate evidence, no progress.
- A DEFERRED Jev verdict is never a pass.
- Publish, deploy, push or send needs Gate-D approval from Mike.
shared_by: [ds-website-build, ds-landing-page, ds-redesign, ds-brand-identity-session, ds-critique-session]
