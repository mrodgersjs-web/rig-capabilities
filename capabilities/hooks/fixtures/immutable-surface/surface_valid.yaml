# Declared mutable surface for a self-improvement loop (Recuris-shaped).
# Everything not listed here is fixed by declaration: an edit to it makes any
# score delta unattributable to the mutable layer.
harness_id: recuris-style-experience-loop
root: harness
mutable_surface:
  - memory/*.md
  - memory/archive/*.jsonl
  - config/notes.yaml
  - runs/*.jsonl
immutable:
  - machine/self_improver.py
  - machine/check_gate.py
  - machine/validate_run.py
