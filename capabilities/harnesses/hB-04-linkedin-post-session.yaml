read_first:
  jev_before_anything_else: >-
    AGENTS.md requires JEV on every job. Run the JEV gate BEFORE drafting, before any model call
    for copy, and before any publish decision. This is not optional and it is not step 3.
  jev_command: './bin/rig-s1gate check post.linkedin --file <draft> --subject <id>@<sha256-12> --json'
  pre_publish_gate: 'python3 /Users/rig128gb/Developer/rig-capabilities/capabilities/harnesses/linkedin-post-gates/li_post_gate.py <draft> --selftest'
  evidence: /Users/rig128gb/Developer/rig-capabilities/capabilities/harnesses/linkedin-post-gates/CITATIONS.md
  measurement: /Users/rig128gb/Developer/rig-capabilities/capabilities/harnesses/linkedin-post-gates/postflight.md
  if_any_of_the_above_is_unavailable: DEFER and say so out loud. Never guess a verdict, never
    publish on a verdict you could not obtain, and never report an unrun gate as PASS.

