---
outcome: design-ux:
done_when:
  - file:capabilities/harnesses/hC-12-design-handoff.yaml
  - cmd:./bin/rig-capabilities goal-spec --stem hC-12-design-handoff
great_example: examples/great/design-ux/hC-12-design-handoff.md
quality_floor: 0.6
---

harness_id: hC-12-design-handoff-session
harness_name: Design Handoff Goal Harness
session_type: design-handoff-session
coordinate_space:
  levels:
  - L3
  - L4
  diamonds:
  - D1
  bms_modes:
  - A1
  - A2
  iqrsqpi_steps:
  - I
  - Q
  - R
  - S
  - Q2
  - P
  - I2
harness_tuple: H_design_handoff_session(identity, gates, dod, failure_protocol, self_improvement)
primary_diamonds:
- D1
bms_bias: A1-A2 preferred; A3 permitted for spec-document structure; A4 only with approval
identity_lock:
  startup_phrase: 'Design handoff mode: the builder never guesses — every pixel, state, and token is specified or
    flagged.'
  gates:
  - id: '0.1'
    requirement: Startup phrase spoken and session type declared before any work begins
  - id: '0.2'
    requirement: RIG operating procedures loaded and declared mandatory for this session
  - id: '0.3'
    requirement: 'RIG coordinate stated verbatim: L3-D1-A1'
  - id: '0.4'
    requirement: 'Harness tuple declared verbatim: H_design_handoff(identity, gates, dod, failure_protocol, self_improvement)'
  - id: '0.5'
    requirement: Goal-card for the session written to artifacts/<session>/goal-card.yaml with an executable done_test
capability_gates:
- category: Freeze & Inventory
  gates:
  - id: '1.1'
    requirement: 'Design source frozen: immutable export hashed before any spec work begins'
    proof: artifacts/handoff/<slug>/FREEZE.txt with sha256 of source export + freeze timestamp
    failure_tier: halt
  - id: '1.2'
    requirement: 'Screen/component inventory complete: every screen, component instance, and flow link enumerated'
    proof: 'artifacts/handoff/<slug>/inventory.yaml: `screen, components[], flows[]` per entry; count matches frozen
      source'
    failure_tier: halt
  - id: '1.3'
    requirement: 'Asset export complete: icons/illustrations as SVG, raster at @1x/@2x/@3x where needed, all named
      by convention'
    proof: assets/ directory listing vs inventory cross-check passes; manifest with sha256 per asset
    failure_tier: halt
- category: Specification
  gates:
  - id: '2.1'
    requirement: 'Spec annotations complete: spacing, sizing, and typography specified for every element — no un-annotated
      region'
    proof: 'annotation coverage report: annotated-element count / total-element count = 100% or gaps listed with
      owner'
    failure_tier: halt
  - id: '2.2'
    requirement: 'Token mapping table: every design value maps to a code token (color/space/font/motion), gaps filed
      as token requests'
    proof: 'artifacts/handoff/<slug>/token-map.yaml: `design_value -> token_path` entries; gap list with requested
      token names'
    failure_tier: halt
  - id: '2.3'
    requirement: 'State matrix delivered per interactive component: default/hover/active/focus/disabled/loading/empty/error'
    proof: states matrix in spec doc; deferrals explicitly marked with reason and owner
    failure_tier: halt
  - id: '2.4'
    requirement: 'Responsive behavior specified: per-breakpoint layout rules, not ''make it responsive'''
    proof: 'breakpoint table per screen: container behavior, reflow rules, and min/max constraints'
    failure_tier: degrade
  - id: '2.5'
    requirement: 'Copy deck finalized: all user-facing strings externalized with character limits and truncation
      rules'
    proof: copy-deck.yaml with `string_id, text, max_chars, truncation_rule` per string
    failure_tier: degrade
- category: Transfer & Control
  gates:
  - id: '3.1'
    requirement: 'Open-questions log: every ambiguity the builder would hit is either resolved in-spec or logged
      with an owner and due date'
    proof: 'open-questions.yaml: `question, owner, due, blocking: true|false` per entry; blocking:true count = 0
      at handoff'
    failure_tier: halt
  - id: '3.2'
    requirement: 'Acceptance walkthrough held: builder confirms they can implement from the spec alone; questions
      captured'
    proof: walkthrough notes artifact with attendee, date, and question dispositions
    failure_tier: degrade
  - id: '3.3'
    requirement: 'Handoff checklist signed by both sides: design-complete and build-ready checkboxes all ticked'
    proof: checklist artifact with dual sign-off lines filled (design + build), dated
    failure_tier: halt
  - id: '3.4'
    requirement: 'Change control declared: post-handoff design changes re-enter this harness as a new revision with
      its own freeze hash'
    proof: change-control section in spec doc; revision counter initialized at R1 with FREEZE.txt hash linked
    failure_tier: degrade
definition_of_done:
- All 12 capability gates passed with artifacts under artifacts/handoff/<slug>/
- 'Primary objective achieved: dual-signed, fully-specified handoff with zero blocking open questions'
- Token map has no unresolved gaps without filed token requests
- One improvement entry appended to ~/.hermes/jake/improvements.log
- 'Identity closure: coordinate, verdict, and next safe action stated'
failure_protocol:
  halt_gates:
  - '1.1'
  - '1.2'
  - '1.3'
  - '2.1'
  - '2.2'
  - '2.3'
  - '3.1'
  - '3.3'
  degrade_gates:
  - '2.4'
  - '2.5'
  - '3.2'
  - '3.4'
  stop_gates: []
self_improvement:
  log_path: ~/.hermes/jake/improvements.log
  pattern_cadence: 5
  update_trigger: same gate fails 3+ times across sessions
final_rule:
- No gate evidence, no progress.
- No improvement entry, no session complete.
- Outward action (publish, send, deploy) requires Gate-D approval — v0 is local-only.
- Every design-handoff-session session leaves the system stronger than it found it.
governs_loops:
- GL-BD
- GL-SH
