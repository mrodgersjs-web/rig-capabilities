---
tier: sub
parent: ds-website-build
outcome: "design-ux: Ship gate run with every gate evidenced by a file or command output"
done_when:
  - file:studio-harness/harnesses/ds-gate-ship.yaml
  - cmd:python3 tools/check_family.py
quality_floor: 0.6
---

harness_id: ds-gate-ship
harness_name: Ship gate
session_type: gate
jev_first: 'Typed judgments at every gate go to rig-s1gate (Jev) before any frontier LLM call; classifier down means DEFERRED, never a guessed verdict.'
identity_lock:
  startup_phrase: 'Ship gate: evidence or it did not pass.'
  gates:
  - id: '0.1'
    requirement: Load design-studio-os and state the mode (BUILD, REDESIGN, CRITIQUE, FIX, LEARN) before any work
  - id: '0.2'
    requirement: Goal card written to artifacts/<slug>/goal-card.yaml with buyer, success metric and an executable done_test
capability_gates:
- category: Ship
  gates:
  - id: '4.1'
    requirement: 'Production build served locally and clicked through'
    proof: 'command output plus capture of the served URL'
    failure_tier: halt
  - id: '4.2'
    requirement: 'Performance and accessibility checks recorded'
    proof: 'lighthouse or equivalent JSON in artifacts/<slug>/'
    failure_tier: degrade
  - id: '4.3'
    requirement: 'Gate-D request filed for any publish or deploy'
    proof: 'gate_d request id in artifacts/<slug>/gates.md'
    failure_tier: halt
definition_of_done:
- Gate category evidenced
failure_protocol:
  halt_gates:
  - '4.1'
  - '4.3'
final_rule:
- No gate evidence, no progress.
- A DEFERRED Jev verdict is never a pass.
- Publish, deploy, push or send needs Gate-D approval from Mike.
shared_by: [ds-website-build, ds-landing-page, ds-redesign, ds-brand-identity-session, ds-critique-session]
